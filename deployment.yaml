apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-noticeboard-deployment
  labels:
    app: noticeboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noticeboard
  template:
    metadata:
      labels:
        app: noticeboard
    spec:
      containers:
      - name: noticeboard-container
        image: theatomicxm/college-noticeboard:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-noticeboard-service
spec:
  type: NodePort
  selector:
    app: noticeboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
