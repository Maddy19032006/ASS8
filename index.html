<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .form-container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Student Feedback Form</h2>
        <form>
            <label>Student Name:</label> <input type="text" required>
            <label>Register Number:</label> <input type="text" required>
            <label>Department:</label> <input type="text" required>
            <label>Course Name:</label> <input type="text" required>
            <label>Faculty Name:</label> <input type="text" required>
            <label>Rating:</label>
            <select required>
                <option value="5">Excellent (5)</option>
                <option value="4">Good (4)</option>
                <option value="3">Average (3)</option>
                <option value="2">Poor (2)</option>
                <option value="1">Very Poor (1)</option>
            </select>
            <label>Feedback/Comments:</label> <textarea rows="4" required></textarea>
            <button type="submit">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
